[project]
name = "androidsecforge"
version = "0.1.1"
description = "Modular Android security research and assessment framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
androidsecforge = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
namespaces = true

[tool.setuptools.package-data]
"app.web" = ["index.html"]
"app.rules" = ["definitions/*.json"]
"app.testapp" = ["*.c"]
"app.analysis" = ["ghidra_scripts/*.py", "ghidra_scripts/*.java"]